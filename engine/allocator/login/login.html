<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Sign in · GitOps Dojo</title>
<link rel="icon" type="image/png" href="/login/assets/favicon.png">
<link rel="stylesheet" href="/login/assets/login.css">
<script src="/login/assets/login.js" defer></script>
</head>
<body>
<div class="backdrop" aria-hidden="true"><span class="orb orb-a"></span><span class="orb orb-b"></span><span class="grid"></span></div>

<main class="stage">
  <section class="card{{CARD_CLASS}}" aria-labelledby="title">
    <picture class="logo">
      <source media="(prefers-color-scheme: light)" srcset="/login/assets/logo-light.png">
      <img src="/login/assets/logo-dark.png" alt="gitops_dojo: slideshows and workshop environments" width="380" height="126">
    </picture>

    <p class="chip"><span class="dot"></span>{{WORKSHOP}}</p>
    <h1 id="title">Step into the dojo</h1>
    <p class="lede">{{LEDE}}</p>

    {{ERROR}}
    <form method="post" action="/login" autocomplete="on" novalidate>
      <input type="hidden" name="next" value="{{NEXT}}">

      <label class="field">
        <span class="label">Username</span>
        <span class="control">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input name="username" type="text" value="{{USERNAME}}" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        </span>
      </label>

      <label class="field">
        <span class="label">Password</span>
        <span class="control">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="reveal" aria-label="Show password" aria-pressed="false" hidden>
            <svg class="eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19C5.6 19 2 12 2 12a18.5 18.5 0 0 1 5.1-5.9M9.9 5.2A9.6 9.6 0 0 1 12 5c6.4 0 10 7 10 7a18.6 18.6 0 0 1-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/></svg>
          </button>
        </span>
        <span class="caps" hidden>Caps Lock is on</span>
      </label>

      <button class="submit" type="submit"><span class="spin" aria-hidden="true"></span><span class="txt">Enter the dojo</span></button>
    </form>

    <p class="hint">The class login is on the slide at the front of the room.</p>
  </section>

  <p class="prompt" aria-hidden="true"><span class="ps">$</span> git push origin <span class="ok">dojo</span><span class="caret"></span></p>
</main>
</body>
</html>
