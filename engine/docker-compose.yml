version: '3.8'

# Reusable workshop engine. Nothing here should need editing per-workshop —
# point WORKSHOP_CONTENT_DIR (in .env, or a workshops/<name>/workshop.env
# picked up by run.sh) at a workshops/<name>/content folder and configure
# accounts/ports/PUBLIC_BASE_URL in .env. See README.md.
#
# A workshop that needs more than different content (a different terminal
# image, an extra backend service) layers a Compose override file on top of
# this one instead of editing it — see workshops/README.md and run.sh.
#
# The gateway is the only service with a published port. Everything else
# sits on the internal network, unreachable from outside the stack.
#
# Every volume below is ephemeral by design: named volumes only, no host
# bind mounts for runtime data. `./run.sh stop` (or
# `docker compose down --volumes`) always returns to a clean slate.

services:
  # 1. Git server (Forgejo)
  git-server:
    image: codeberg.org/forgejo/forgejo:16.0.4@sha256:a3e33d03e771d3e58b27de5573c3a25dc4f670583a6724c1878a6d0bbecf3556
    container_name: workshop_forge
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__server__LANDING_PAGE=explore
      - FORGEJO__server__ROOT_URL=${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in engine/.env}/git/
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - FORGEJO__service__SHOW_REGISTRATION_BUTTON=false
    volumes:
      - forgejo_data:/data
    networks:
      - workshop_lab
      # Also reachable from bootstrap_net so the one-shot bootstrap service
      # (which lives on bootstrap_net only -- see below) can still reach it;
      # git-server keeps workshop_lab too, since gateway, allocator, and
      # web-terminal's bot-runner.sh all still need to reach it there.
      - bootstrap_net
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/healthz" ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    # Backstop so a git-gc/large-push spike here can't eat into the memory
    # budget web-terminal's own mem_limit was sized against (see
    # scripts/capacity-calc.sh) -- generous for 30 concurrent students'
    # worth of clone/push/PR-review traffic, not a tight cap.
    mem_limit: ${GIT_SERVER_MEM_LIMIT:-2g}

  # 2. One-shot bootstrap: admin user, org, sample repo, and one Forgejo
  #    account per configured student. Safe to re-run; exits after it's done.
  bootstrap:
    image: codeberg.org/forgejo/forgejo:16.0.4@sha256:a3e33d03e771d3e58b27de5573c3a25dc4f670583a6724c1878a6d0bbecf3556
    container_name: workshop_bootstrap
    depends_on:
      git-server:
        condition: service_healthy
    user: "1000:1000"
    environment:
      - FORGEJO_ADMIN_USER=${FORGEJO_ADMIN_USER:?Set FORGEJO_ADMIN_USER in engine/.env}
      - FORGEJO_ADMIN_PASSWORD=${FORGEJO_ADMIN_PASSWORD:?Set FORGEJO_ADMIN_PASSWORD in engine/.env}
      - FORGEJO_ADMIN_EMAIL=${FORGEJO_ADMIN_EMAIL:-admin@example.com}
      - FORGEJO_ORG=${FORGEJO_ORG:-training}
      - FORGEJO_REPO=${FORGEJO_REPO:-sample-training-repo}
      - FORGEJO_SEED_DIR=/seed
      - STUDENT_COUNT=${STUDENT_COUNT:-30}
      - STUDENT_PREFIX=${STUDENT_PREFIX:-student}
      # Per-student Forgejo passwords (dojo-secret.sh). STUDENT_PASSWORD is
      # only the fallback for an engine/.env without a seed.
      - STUDENT_PASSWORD_SEED=${STUDENT_PASSWORD_SEED:-}
      - STUDENT_PASSWORD=${STUDENT_PASSWORD:-student123}
      # Demo/test bots (--test) -- see run.sh and README.md. 0 (disabled)
      # unless a facilitator opted in.
      - BOT_COUNT=${BOT_COUNT:-0}
      - BOT_PREFIX=${BOT_PREFIX:-testuser}
      - BOT_PASSWORD=${BOT_PASSWORD:-testuser123}
    volumes:
      - forgejo_data:/data
      - ./git-server/bootstrap.sh:/bootstrap.sh:ro
      - ./git-server/dojo-secret.sh:/dojo-secret.sh:ro
      - ${WORKSHOP_CONTENT_DIR:?Set WORKSHOP_CONTENT_DIR in engine/.env}/sample-repo:/seed:ro
    entrypoint: [ "/bin/sh", "/bootstrap.sh" ]
    # Isolated to its own network, not workshop_lab -- bootstrap only ever
    # calls git-server (see bootstrap.sh), it never needs to reach allocator
    # or web-terminal, so it genuinely can be denied any path to either
    # (unlike allocator, which must share workshop_lab with web-terminal/
    # git-server for its own legitimate outbound calls, and is instead
    # protected by the GATEWAY_TOKEN check above).
    networks:
      - bootstrap_net
    restart: "no"

  # 3. Interactive presentation layer (Marp)
  presentation:
    # Local build instead of upstream marpteam/marp-cli (~1.07 GB, mostly
    # a Chromium layer only PDF/PPTX export uses) -- see
    # presentation/Dockerfile. run.sh builds and tags it, same as
    # allocator and gateway below.
    build:
      context: ./presentation
    image: gitopsdojo/presentation:local
    container_name: workshop_presentation
    # PID 1 here is python/node with no SIGTERM handler, and the kernel ignores
    # SIGTERM for PID 1, so `stop` waited 10 s then SIGKILLed. init: true runs a
    # tiny init as PID 1 that forwards the signal.
    init: true
    volumes:
      - ${WORKSHOP_CONTENT_DIR:?Set WORKSHOP_CONTENT_DIR in engine/.env}/slides:/home/marp/app:ro
      # Shared slide CSS (workshops/assets/themes/*.css), mounted as a
      # subdirectory of the served root so slides can reference it with a
      # plain relative @import (e.g. 'assets/themes/hub.css') -- one file
      # edited once, used by every workshop. Not workshop-specific, so it
      # lives here rather than under any single workshops/<name>/.
      - ../workshops/assets:/home/marp/app/assets:ro
    command: -s --http --html .
    networks:
      - web_lab
    restart: unless-stopped
    # Backstop, same reasoning as git-server's above.
    mem_limit: ${PRESENTATION_MEM_LIMIT:-512m}

  # 4. Workspace host: per-account code-server + ttyd processes, spawned on
  # demand by workspace-control.py once the allocator (service 5a below)
  # assigns a browser session an account. No per-account login prompt any
  # more -- the account's Linux user, home dir, and shell are still
  # provisioned exactly as before by entrypoint.sh.
  web-terminal:
    build:
      context: ./web-terminal
    # run.sh builds :base from ./web-terminal, then any module and workshop
    # terminal/ Dockerfiles as a chain on top of it (each `FROM ${BASE}`,
    # see docs/archive/MODULES-PLAN.md §4.2), and sets WEB_TERMINAL_IMAGE to the
    # last link. Overlays no longer set image: here themselves.
    image: ${WEB_TERMINAL_IMAGE:-gitopsdojo/web-terminal:base}
    container_name: workshop_terminal
    init: true  # PID 1 is python; see presentation's note
    environment:
      - WORKSHOP_NAME=${WORKSHOP_NAME:-Workshop Lab}
      - STUDENT_COUNT=${STUDENT_COUNT:-30}
      - STUDENT_PREFIX=${STUDENT_PREFIX:-student}
      # entrypoint.sh finds the terminal_ingress interface by this subnet
      # and lets the IDE/terminal ports answer only there (and on lo).
      - TERMINAL_INGRESS_SUBNET=${TERMINAL_INGRESS_SUBNET:-172.30.9.0/24}
      # Root only: forgejo-token.py derives each student's Forgejo password
      # from the seed to mint that student's git token. Students never see
      # it: their shells and IDEs start through `su -`, which clears the
      # environment, and /proc/1/environ is root's.
      - STUDENT_PASSWORD_SEED=${STUDENT_PASSWORD_SEED:-}
      - STUDENT_PASSWORD=${STUDENT_PASSWORD:-student123}
      # Demo/test bots (--test) -- see run.sh and README.md's "Demo bots"
      # section. BOT_COUNT=0 (the default) disables this entirely.
      - BOT_COUNT=${BOT_COUNT:-0}
      - BOT_PREFIX=${BOT_PREFIX:-testuser}
      - BOT_PASSWORD=${BOT_PASSWORD:-testuser123}
      - BOT_FAST=${BOT_FAST:-0}
      - FORGEJO_ORG=${FORGEJO_ORG:-training}
      - FORGEJO_REPO=${FORGEJO_REPO:-sample-training-repo}
      # 1 = the workshop's labs have each student fork the repo; bots do the same.
      # Off by default (set in workshop.env) -- see bot-runner.sh.
      - FORGEJO_FORK_WORKFLOW=${FORGEJO_FORK_WORKFLOW:-0}
      - FACILITATOR_USERNAME=${FACILITATOR_USERNAME:-root}
      # No weak fallback -- entrypoint.sh grants this account passwordful
      # sudo, so a missing value must fail closed instead of defaulting to
      # a guessable password. Set a real value in .env.
      - FACILITATOR_PASSWORD=${FACILITATOR_PASSWORD:?Set FACILITATOR_PASSWORD in engine/.env}
      # "web" (VS Code + tmux) or "zellij" (a Zellij terminal, no IDE) -- see
      # engine/zellij-terminal/ and workspace-control.py. run.sh also builds the
      # matching image; allocator gets the same value (it hides the VS Code tab).
      - TERMINAL_FLAVOR=${TERMINAL_FLAVOR:-web}
      # Zellij flavor only: the browser terminal's font (a CSS font-family list) and size.
      # Empty = the built-in system monospace stack and 14; see workspace-control.py.
      - TERMINAL_FONT_FAMILY=${TERMINAL_FONT_FAMILY:-}
      - TERMINAL_FONT_SIZE=${TERMINAL_FONT_SIZE:-}
      # Per-process V8 heap cap for each spawned code-server -- see
      # workspace-control.py. A safety net under mem_limit below, not a
      # replacement for it.
      - CODE_SERVER_MAX_HEAP_MB=${CODE_SERVER_MAX_HEAP_MB:-384}
      # Per-student process limit, a fork-bomb tripwire (0 = off); see
      # workspace-control.py.
      - TERMINAL_NPROC_LIMIT=${TERMINAL_NPROC_LIMIT:-1024}
      # How long a code-server lingers once its browser tab closes -- see
      # workspace-control.py. Frees memory from students who have left
      # (break, end of class) without touching anyone still connected.
      - CODE_SERVER_RECONNECTION_GRACE_SECONDS=${CODE_SERVER_RECONNECTION_GRACE_SECONDS:-300}
      - CODE_SERVER_IDLE_TIMEOUT_SECONDS=${CODE_SERVER_IDLE_TIMEOUT_SECONDS:-900}
      # Shared secret workspace-control.py checks on every request -- proves
      # a start/stop/status call actually came from the allocator, not some
      # other container on this internal network. Must match allocator's
      # own CONTROL_TOKEN below (allocator/allocation.py's control_request()).
      - CONTROL_TOKEN=${CONTROL_TOKEN:?Set CONTROL_TOKEN in engine/.env}
    volumes:
      - terminal_home:/home
      - ${WORKSHOP_CONTENT_DIR:?Set WORKSHOP_CONTENT_DIR in engine/.env}/lab:/opt/lab:ro
      # Whole content dir, for the workshop's own demo-bot steps
      # (content/bots/steps.sh, see bot-runner.sh). Mounted as the dir rather
      # than content/bots so a workshop without bots doesn't break the mount.
      - ${WORKSHOP_CONTENT_DIR:?Set WORKSHOP_CONTENT_DIR in engine/.env}:/opt/workshop-content:ro
    # Map form (not the usual list) for the alias: the gateway dials
    # web-terminal-ingress, which resolves only to this container's
    # terminal_ingress address. No fragment adds networks here; one that
    # does must use the map form too.
    networks:
      workshop_lab: {}
      terminal_ingress:
        aliases:
          - web-terminal-ingress
    restart: unless-stopped
    # Grants only what entrypoint.sh's iptables DOJO_ISOLATION chain needs
    # to firewall loopback traffic between accounts inside this container's
    # own network stack (see that file) -- every student/bot shares one
    # netns here, so without this a student's shell can curl straight into
    # another student's code-server/ttyd with zero auth. Scoped to this
    # container's own interfaces/netns only, not the host's.
    cap_add:
      - NET_ADMIN
    # Container-wide backstop for the per-account ulimits set in
    # entrypoint.sh (nproc/fsize per student/facilitator shell), AND for
    # the per-process code-server heap cap above -- this is the ceiling
    # for all of them combined. Every delivery path (Azure VM included) now
    # sets these by hand -- see scripts/capacity-calc.sh and .env's comment
    # on these two vars.
    pids_limit: ${WEB_TERMINAL_PIDS_LIMIT:-2048}
    mem_limit: ${WEB_TERMINAL_MEM_LIMIT:-4g}

  # 5a. Allocator: assigns each browser session a student01..NN account
  # (or the facilitator's own), tracks name/IP for the facilitator
  # dashboard, and gates /ide + /term via Caddy's forward_auth (see
  # gateway/Caddyfile and allocator/api.py). Internal-only, like
  # dns-server in the dns-as-code overlay -- no published port, no
  # docker.sock, no persistent storage (in-memory, resets with the
  # container like everything else in this stack).
  allocator:
    build:
      context: ./allocator
    # Stable local tag, same reasoning as web-terminal's below -- lets
    # run.sh check "has ./allocator changed since the last build?" against
    # a fixed name instead of guessing whatever tag Compose would have
    # auto-generated.
    image: gitopsdojo/allocator:local
    container_name: workshop_allocator
    init: true  # PID 1 is python; see presentation's note
    environment:
      # Read only to decide whether the session cookie should be marked
      # Secure (see allocator/config.py's COOKIE_SECURE) -- allocator never
      # constructs a URL from this itself, gateway already owns routing.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in engine/.env}
      # The Slides status check calls the gateway at this address when set.
      - GATEWAY_LISTEN=${GATEWAY_LISTEN:-}
      # The sign-in page (/login) checks these; the Slides status check
      # signs in as the class account (/slides is behind it).
      - TTYD_USERNAME=${TTYD_USERNAME:?Set TTYD_USERNAME in engine/.env}
      - TTYD_PASSWORD=${TTYD_PASSWORD:?Set TTYD_PASSWORD in engine/.env}
      - WORKSHOP_DESCRIPTION=${WORKSHOP_DESCRIPTION:-}
      - FACILITATOR_PASSWORD=${FACILITATOR_PASSWORD:?Set FACILITATOR_PASSWORD in engine/.env}
      - WORKSHOP_NAME=${WORKSHOP_NAME:-Workshop Lab}
      - STUDENT_COUNT=${STUDENT_COUNT:-30}
      - STUDENT_PREFIX=${STUDENT_PREFIX:-student}
      # How fast new slots go out (allocator/allocation.py AssignLimit).
      - ASSIGN_BURST=${ASSIGN_BURST:-10}
      - ASSIGN_PER_MINUTE=${ASSIGN_PER_MINUTE:-20}
      # Demo/test bots (--test): included as always-on roster rows (see
      # /admin/api/sessions) so a facilitator can watch/Release them like
      # any student, without ever competing with real students for a
      # studentNN slot -- see README.md's "Demo bots (--test)" section.
      - BOT_COUNT=${BOT_COUNT:-0}
      - BOT_PREFIX=${BOT_PREFIX:-testuser}
      # Must match web-terminal's TERMINAL_FLAVOR: "zellij" has no IDE, so the VS
      # Code tab, landing card and /ide route are not offered.
      - TERMINAL_FLAVOR=${TERMINAL_FLAVOR:-web}
      # Must match web-terminal's FACILITATOR_USERNAME below -- used to
      # recognize the facilitator's own (non-student-slot) sessions.
      - FACILITATOR_USERNAME=${FACILITATOR_USERNAME:-root}
      # Deep-links the landing page's Forgejo button at the org/repo
      # bootstrap.sh actually seeds -- must match its own FORGEJO_ORG/
      # FORGEJO_REPO defaults below.
      - FORGEJO_ORG=${FORGEJO_ORG:-training}
      - FORGEJO_REPO=${FORGEJO_REPO:-sample-training-repo}
      # SSO into Forgejo (see /forgejo-login in allocator/handler.py): the
      # allocator logs the browser straight into the Forgejo account
      # matching whatever identity it already resolved (studentNN or the
      # facilitator's own admin account) by POSTing Forgejo's login form
      # itself, server-side, over the internal network -- these must match
      # bootstrap.sh's own credentials for the accounts it actually seeded
      # (per-student passwords from the seed, dojo_secret.py).
      - STUDENT_PASSWORD_SEED=${STUDENT_PASSWORD_SEED:-}
      - STUDENT_PASSWORD=${STUDENT_PASSWORD:-student123}
      - FORGEJO_ADMIN_USER=${FORGEJO_ADMIN_USER:?Set FORGEJO_ADMIN_USER in engine/.env}
      - FORGEJO_ADMIN_PASSWORD=${FORGEJO_ADMIN_PASSWORD:?Set FORGEJO_ADMIN_PASSWORD in engine/.env}
      # A student reset recreates a demo bot's Forgejo account with this
      # (allocator/reset.py), as bootstrap.sh made it.
      - BOT_PASSWORD=${BOT_PASSWORD:-testuser123}
      # Shared secret allocator's control_request() sends on every call to
      # web-terminal's control API -- must match web-terminal's own
      # CONTROL_TOKEN above (workspace-control.py checks it on every
      # request).
      - CONTROL_TOKEN=${CONTROL_TOKEN:?Set CONTROL_TOKEN in engine/.env}
      # Shared secret allocator requires on EVERY request (checked before
      # resolve_identity() ever trusts X-Auth-User) -- proves the request
      # actually came through Caddy, not directly from some other
      # container on the shared workshop_lab network. Must match
      # gateway's own GATEWAY_TOKEN below (gateway/Caddyfile's header_up
      # X-Gateway-Token on every block that proxies to allocator:8080).
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:?Set GATEWAY_TOKEN in engine/.env}
      - ALLOCATOR_STATE_FILE=/var/lib/dojo-allocator/slots.json
    volumes:
      # The workshop's checked extensions (cards, /admin tabs, route gates,
      # status checks), written by run.sh before every start.
      - ./.generated/allocator:/etc/dojo/extensions:ro
      # The slot table (who holds which studentNN), saved on every claim and
      # release so a crash or OOM restart keeps every assignment. Named, so
      # `./run.sh stop` wipes it with the rest of the class.
      - allocator_state:/var/lib/dojo-allocator
    networks:
      - workshop_lab
    restart: unless-stopped
    # Backstop, same reasoning as git-server's above -- roster state for 30
    # students is trivial, this is just a ceiling in case of a leak.
    mem_limit: ${ALLOCATOR_MEM_LIMIT:-256m}

  # 5b. Gateway: the only service exposed to students. Single hostname,
  # path-based routing (/slides, /git, /admin, /ide, /term, / ->
  # allocator), one shared login for the terminal + Forgejo. See
  # gateway/Caddyfile.
  gateway:
    build:
      context: ./gateway
    # Stable local tag -- see the same note on allocator above.
    image: gitopsdojo/gateway:local
    container_name: workshop_gateway
    environment:
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in engine/.env}
      # Set only when another proxy terminates TLS in front of the lab.
      - GATEWAY_LISTEN=${GATEWAY_LISTEN:-}
      # The proxy in front of GATEWAY_LISTEN, as the gateway sees it (CIDR,
      # space-separated): the login limit then keys on the real client address.
      - GATEWAY_TRUSTED_PROXIES=${GATEWAY_TRUSTED_PROXIES:-}
      # sha256 of "dojo-gate:<--pass code>"; empty = no access-code page.
      - GATEWAY_GATE_TOKEN=${GATEWAY_GATE_TOKEN:-}
      # Shared secret the Caddyfile sends as X-Gateway-Token on every block
      # that proxies to allocator:8080 -- must match allocator's own
      # GATEWAY_TOKEN above (allocator/handler.py's gateway_authorized()).
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:?Set GATEWAY_TOKEN in engine/.env}
    # Same port on both sides: Caddy listens on whatever port PUBLIC_BASE_URL
    # names (e.g. http://localhost:8080 -> :8080 inside the container), and
    # run.sh expects that port to match GATEWAY_HTTP(S)_PORT.
    ports:
      - "${LAB_HOST_IP:?Set LAB_HOST_IP in engine/.env}:${GATEWAY_HTTP_PORT:-8080}:${GATEWAY_HTTP_PORT:-8080}"
      - "${LAB_HOST_IP:?Set LAB_HOST_IP in engine/.env}:${GATEWAY_HTTPS_PORT:-8443}:${GATEWAY_HTTPS_PORT:-8443}"
    volumes:
      # The workshop's extension routes, rendered from its extensions.json
      # by run.sh before every start; gateway/Caddyfile imports them.
      - ./.generated/gateway:/etc/caddy/extensions:ro
    networks:
      - public
      - workshop_lab
      - web_lab
      - terminal_ingress
    restart: unless-stopped
    # Backstop, same reasoning as git-server's above -- Caddy proxying 30
    # concurrent sessions is still lightweight, this is just a ceiling.
    mem_limit: ${GATEWAY_MEM_LIMIT:-256m}

volumes:
  terminal_home:
  forgejo_data:
  allocator_state:

networks:
  public:
  workshop_lab:
    internal: true
  web_lab:
    internal: true
  # The gateway's only path to the students' IDE and terminal ports
  # (9000-9899) (remediation T2.2a, FIND-04): web-terminal drops them on
  # every other interface, so a CI job, runner or module service on
  # workshop_lab can't reach a workspace that skips Caddy's auth-check.
  # Only gateway and web-terminal join it; run.sh refuses a module or
  # workshop fragment that mentions it. Fixed subnet so entrypoint.sh can
  # find the interface; TERMINAL_INGRESS_SUBNET overrides a clash.
  terminal_ingress:
    internal: true
    ipam:
      config:
        - subnet: ${TERMINAL_INGRESS_SUBNET:-172.30.9.0/24}
  # Isolates the one-shot bootstrap service (only ever calls git-server) so
  # it has no network path to allocator or web-terminal at all -- those two
  # stay on workshop_lab only. See the bootstrap/git-server service blocks
  # above.
  bootstrap_net:
    internal: true
