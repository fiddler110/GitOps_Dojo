<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Access code</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/_gate/gate.css">
</head>
<body>
  <main class="card">
    <h1>Access code</h1>
    <p class="muted">This lab is private. Enter the access code you were given to continue to the sign-in page.</p>
    <form id="gate" autocomplete="off">
      <input id="code" type="password" name="code" placeholder="Access code" autofocus required>
      <button type="submit">Continue</button>
    </form>
    <p id="msg" class="msg" role="alert" hidden></p>
  </main>
  <script src="/_gate/gate.js"></script>
</body>
</html>
