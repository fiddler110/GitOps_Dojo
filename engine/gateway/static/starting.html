<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Starting your workspace…</title>
<meta http-equiv="refresh" content="1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         display: flex; min-height: 100vh; margin: 0; align-items: center; justify-content: center;
         color: #1a1a1a; background: #fafafa; }
  @media (prefers-color-scheme: dark) { body { color: #eee; background: #171717; } }
  .box { text-align: center; max-width: 22rem; padding: 0 1.25rem; }
  .spinner { width: 2rem; height: 2rem; margin: 0 auto 1.25rem; border-radius: 50%;
             border: 3px solid #c7d2fe; border-top-color: #2563eb; animation: spin 0.8s linear infinite; }
  @media (prefers-color-scheme: dark) { .spinner { border-color: #333; border-top-color: #2563eb; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { margin: 0; opacity: 0.75; font-size: 0.9rem; }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>Starting your workspace…</h1>
    <p>This page will refresh itself automatically.</p>
  </div>
</body>
</html>
