# System-wide tmux config, installed at /etc/tmux.conf (see Dockerfile) --
# read by every account's tmux server on this container. Student tmux
# sessions are namespaced per-uid (see workspace-control.py), so a
# per-user ~/.tmux.conf would need to exist once per student; this one
# file covers all of them plus the facilitator.

# Mouse support: wheel-scroll enters copy-mode and scrolls the pane
# instead of doing nothing (or leaking escape codes into the shell), and
# dragging a selection starts a copy-mode selection.
set -g mouse on

# vi-style movement/search inside copy-mode (prefix + [, or entered
# automatically by scrolling up) -- easier to discover than tmux's default
# emacs-style bindings for students who don't already use tmux.
setw -g mode-keys vi

# Finish a mouse-drag selection by copying it straight to the tmux paste
# buffer and leaving copy-mode, instead of leaving the pane frozen in
# copy-mode after the drag (tmux's own default behavior).
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# A facilitator's /admin/watch/<studentId> tile attaches a second,
# read-only client to a student's own live session (see
# workspace-control.py's start_watch: `tmux attach -t <session> -r`).
# Deliberately leaving window-size at its default ("latest": size follows
# whichever client most recently sent input) rather than "largest" --
# tmux doesn't rescale a shared pty's content for a client smaller than
# it, it clips to that client's own corner, so "largest" made a normal
# (small, 280px) watch tile show a cropped fragment of the student's
# real terminal instead of the whole thing shrunk to fit.
#
# "latest" pins the pty to whichever client actually drives it, and tmux
# marks a read-only attach (confirmed via `tmux list-clients`) as
# "ignore-size" -- excluded from that choice whenever a real, non-ignored
# client is also attached, which is every actual student. So the watch
# tile can never resize a real student's session no matter how it's
# rendered facilitator-side. (The one case that's *not* true: a session
# nobody else has ever attached to, like a demo bot, which has no
# non-ignored client to fall back to -- there, tmux does use the watch
# client's own size, since it's the only one available. Harmless for a
# bot; just don't read that as "read-only clients are always ignored".)
#
# allocator/static/admin.js's FRAME_W/H is what actually makes a watch tile
# (enlarged or not) show the terminal cleanly: it renders read-only
# clients at one fixed size, comfortably bigger than almost any single
# real terminal pane, then CSS-transform scales that down to whatever
# size the tile wrapper actually is -- deliberately not tracking each
# student's actual pane size to match it exactly (an earlier version
# did; see that file's comment for why that went badly for bots
# specifically, via the ignore-size fallback above).

set -g history-limit 10000

# VS Code's git login hook. The tmux server snapshots its global
# environment from whichever client starts it, usually the first VS Code
# terminal, and every later session (the Terminal tab's `main` included)
# inherits that. When code-server's extension host restarts it listens on
# a new /tmp/vscode-git-*.sock, so the snapshot points at a dead socket and
# `git push` fails with ECONNREFUSED then "unauthorized". Drop the
# snapshot, and let each new session take the current values from the
# client that creates it: a VS Code terminal gets its live socket, the
# Terminal tab gets none and git prompts for the Forgejo password instead.
set-environment -gu GIT_ASKPASS
set-environment -gu VSCODE_GIT_IPC_HANDLE
set-environment -gu VSCODE_GIT_ASKPASS_MAIN
set-environment -gu VSCODE_GIT_ASKPASS_NODE
set-environment -gu VSCODE_GIT_ASKPASS_EXTRA_ARGS
set -ga update-environment " GIT_ASKPASS VSCODE_GIT_IPC_HANDLE VSCODE_GIT_ASKPASS_MAIN VSCODE_GIT_ASKPASS_NODE VSCODE_GIT_ASKPASS_EXTRA_ARGS"
