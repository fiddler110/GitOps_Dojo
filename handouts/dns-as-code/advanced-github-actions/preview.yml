# ADVANCED / OPTIONAL — only works once you've set up a self-hosted runner
# (see 01-local-powerdns-stack.md's advanced section). A GitHub-hosted
# runner has no route to a PowerDNS container on your laptop, so this
# workflow will fail with a connection error unless `runs-on: self-hosted`
# below is actually picked up by a runner you've registered and started.
#
# Adapted from the workshop's .forgejo/workflows/dns-preview.yml — same
# idea (comment the preview diff on the PR, set a status check), but using
# a normal actions/checkout (you have real internet access, unlike the
# workshop's sandboxed instance) and GitHub's own REST API instead of
# Forgejo's. Copy this file to .github/workflows/preview.yml in your repo
# (its sibling, apply.yml, goes to .github/workflows/apply.yml — those
# exact paths are what scripts/dnsctl.py's APPLY_TRIGGER_PATHS expects).
name: DNS Preview

on:
  pull_request:
    branches: [main]
    paths:
      - dnsconfig.js
      - creds.json

jobs:
  preview:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: dnscontrol preview
        id: preview
        run: |
          set +e
          dnscontrol preview >preview-output.txt 2>&1
          echo "status=$?" >>"$GITHUB_OUTPUT"
          cat preview-output.txt

      - name: Post preview as a PR comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -Rs '{body: ("### dnscontrol preview\n\n```\n" + . + "\n```")}' preview-output.txt >comment.json

          existing_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '[.[] | select(.body | startswith("### dnscontrol preview"))][0].id // empty')

          if [ -n "$existing_id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" --input comment.json
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" --input comment.json
          fi

      - name: Set DNS Preview commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=success
          if [ "${{ steps.preview.outputs.status }}" != "0" ]; then state=failure; fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state="$state" -f context="DNS Preview" -f description="dnscontrol preview"

      - name: Fail the job if preview failed
        run: exit ${{ steps.preview.outputs.status }}
