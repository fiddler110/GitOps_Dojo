# achievements module: the class score service (service/server.py), added by engine/run.sh when
# ACHIEVEMENTS_ENABLED=1 and the workshop has achievements/catalog.json. Relative paths resolve
# against engine/, not this folder.

services:
  # Toasts inside Forgejo: its `custom/header` template loads the same toast.js as every other page
  # (same origin through the gateway; a Forgejo tab framed by /workspace or /admin leaves the
  # toasts to the top page). Lists append, so this adds one read-only file mount.
  git-server:
    volumes:
      - ../modules/achievements/forgejo/header.tmpl:/data/gitea/templates/custom/header.tmpl:ro
    # Forgejo refuses to deliver webhooks to private hosts unless allowed: allow this service
    # by name only (not every private address, which would let a student's own repo hook reach
    # any lab service).
    environment:
      - FORGEJO__webhook__ALLOWED_HOST_LIST=achievements

  achievements:
    image: gitopsdojo/allocator:local
    container_name: workshop_achievements
    entrypoint: ["python3", "-B", "/opt/achievements/service/server.py"]
    environment:
      # Identity headers count only with this token (derived per upstream by run.sh).
      - GATEWAY_TOKEN=${GATEWAY_TOKEN_ACHIEVEMENTS:-}
      # The engine's student reset hooks (extensions.json `resets`) carry this.
      - RESET_TOKEN=${RESET_TOKEN_ACHIEVEMENTS:-}
      - FACILITATOR_USERNAME=${FACILITATOR_USERNAME:-root}
      - WORKSHOP_DIR=/opt/workshop
      - FORGEJO_URL=http://git-server:3000
      # The service registers its own Forgejo system webhook at start (service/webhook.py).
      # No `:?` here: `./run.sh stop` reads only engine/.env.
      - FORGEJO_ADMIN_USER=${FORGEJO_ADMIN_USER:-}
      - FORGEJO_ADMIN_PASSWORD=${FORGEJO_ADMIN_PASSWORD:-}
      - WEBHOOK_URL=http://achievements:8080/api/forgejo
      - DATA_DIR=/data
      # dns verifier verbs (plugins/dns) read a student's zone through dns-gate; unused without it.
      - DNS_API_URL=${ACHIEVEMENTS_DNS_API_URL:-http://dns-api:8081}
      - DNS_READ_KEY=${DNS_GATE_READ_KEY:-workshop-not-a-secret}
      # certs verifier verbs (plugins/certs): a workshop's workshop.env sets these; unused when blank.
      - CERTS_TLS_ADDR=${CERTS_TLS_ADDR:-}
      - CERTS_PARENT=${CERTS_PARENT:-certs.dojo.test}
      - CERTS_CA_URL=${CERTS_CA_URL:-}
      # served_mtls presents a client certificate from the lab CA, which the workshop writes into
      # achievements_client_cert (cert-autorenewal's step-ca does); unused when blank or absent.
      - CERTS_CLIENT_CERT=${CERTS_CLIENT_CERT:-}
      - CERTS_CLIENT_KEY=${CERTS_CLIENT_KEY:-}
      # bao verifier verbs (plugins/bao): the read-only token comes from the openbao module.
      - BAO_URL=${BAO_CHECK_URL:-}
      - BAO_CHECK_TOKEN=${BAO_CHECK_TOKEN:-}
      # cloud verifier verbs (plugins/cloud): a read-only credential derived by the dojo-cloud module.
      - CLOUD_API_URL=${ACHIEVEMENTS_CLOUD_API_URL:-}
      - CLOUD_CHECK_TOKEN=${CLOUD_CHECK_TOKEN:-}
      - ACHIEVEMENTS_ANONYMOUS=${ACHIEVEMENTS_ANONYMOUS:-1}
      - ACHIEVEMENTS_HINT_PERCENT=${ACHIEVEMENTS_HINT_PERCENT:-25}
      - ACHIEVEMENTS_FIRST_BLOOD=${ACHIEVEMENTS_FIRST_BLOOD:-1}
      - ACHIEVEMENTS_CLASS_CLEAR=${ACHIEVEMENTS_CLASS_CLEAR:-1}
      - ACHIEVEMENTS_CHEAT_PENALTY=${ACHIEVEMENTS_CHEAT_PENALTY:-1}
      - ACHIEVEMENTS_STATE_SECONDS=${ACHIEVEMENTS_STATE_SECONDS:-20}
      - ACHIEVEMENTS_ADAPTER_SECRET=${ACHIEVEMENTS_ADAPTER_SECRET:-}
      # Sensei (stuck radar, `sensei check`) reads activity and progress with its own gateway token as the key.
      - SENSEI_KEY=${GATEWAY_TOKEN_SENSEI:-}
      - ACHIEVEMENTS_SIGNATURE=${ACHIEVEMENTS_SIGNATURE:-}
      - ACHIEVEMENTS_CLASS_DATE=${ACHIEVEMENTS_CLASS_DATE:-}
      - ACHIEVEMENTS_COMPLETION_PERCENT=${ACHIEVEMENTS_COMPLETION_PERCENT:-80}
      - ACHIEVEMENTS_MILESTONE_POINTS=${ACHIEVEMENTS_MILESTONE_POINTS:-10}
      - ACHIEVEMENTS_FUNNY_POINTS=${ACHIEVEMENTS_FUNNY_POINTS:-0}
      - ACHIEVEMENTS_CHALLENGE_POINTS=${ACHIEVEMENTS_CHALLENGE_POINTS:-100}
      - ACHIEVEMENTS_CAPSTONE_POINTS=${ACHIEVEMENTS_CAPSTONE_POINTS:-300}
    volumes:
      - ../modules/achievements:/opt/achievements:ro
      # The workshop's achievements/ folder (it sits beside content/).
      - ${WORKSHOP_CONTENT_DIR:?Set WORKSHOP_CONTENT_DIR in engine/.env}/../achievements:/opt/workshop/achievements:ro
      - achievements_data:/data
      # A client certificate for the certs verbs, written by a workshop service (empty otherwise).
      - achievements_client_cert:/opt/achievements-client:ro
    # The image's own user can't write a fresh volume under podman: run as a fixed uid.
    user: "0:0"
    cap_drop:
      - ALL
    networks:
      - workshop_lab
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    mem_limit: ${ACHIEVEMENTS_MEM_LIMIT:-128m}
    restart: unless-stopped


volumes:
  achievements_data:
  achievements_client_cert:
