<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attack Range</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 1rem; color: #1b1b1b; background: #fff; }
  h1 { font-size: 1.1rem; margin: 0 0 .5rem; }
  #note { color: #555; font-size: .85rem; margin: 0 0 .75rem; }
  .card { border: 1px solid #ccc; border-radius: 6px; padding: .6rem .75rem; margin-bottom: .5rem; }
  .card.live { border-color: #2a7d2a; }
  .card.error { border-color: #b33; }
  .id { font-weight: 600; }
  .state { font-size: .75rem; text-transform: uppercase; color: #555; margin: .15rem 0 .4rem; }
  .err { color: #b33; font-size: .8rem; margin: 0 0 .4rem; }
  button { margin-right: .4rem; }
</style>
</head>
<body>
<h1>Attack Range</h1>
<p id="note"></p>
<div id="targets"></div>
<script src="app.js"></script>
</body>
</html>
