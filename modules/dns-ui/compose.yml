# dns-ui module, layered on top of engine/docker-compose.yml by engine/run.sh
# when a workshop.env lists it in MODULES (see README.md). Relative paths
# resolve against engine/, not this folder.
#
# Needs the workshop to run a PowerDNS authoritative server as service
# `dns-server` on workshop_lab, with its API on :8081 and the key in
# POWERDNS_API_KEY (dns-as-code and cert-autorenewal both do).
#
# zone-viewer: read-only page of every zone's records, for students and the
# facilitator (/dns, shared gate). It polls PowerDNS itself, so the class
# polling the page costs PowerDNS one read per interval.
#
# dns-admin: PowerDNS-Admin for the facilitator only (/dns-admin, facilitator
# gate), to make a "dashboard" edit that the next `dnscontrol push` undoes.
# It is on dns_admin_net only, with the gateway and dns-server: students can't
# reach it directly, so they can't get round the gate. The workshop's
# dns-server must declare its networks in map form (see dns-server below).
#
#   gateway --dns_admin_net--> dns-admin --dns_admin_net--> dns-server:8081

services:
  zone-viewer:
    build:
      context: ../modules/dns-ui/zone-viewer
    image: gitopsdojo/zone-viewer:local
    container_name: workshop_zone_viewer
    init: true
    depends_on:
      - dns-server
    environment:
      - PDNS_API_URL=http://dns-server:8081
      # Must match the route's path in extensions.json.
      - PATH_PREFIX=/dns
      - POWERDNS_API_KEY=${POWERDNS_API_KEY:-workshop-not-a-secret}
      - POLL_SECONDS=${ZONE_VIEWER_POLL_SECONDS:-2}
    networks:
      - workshop_lab
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    pids_limit: 64
    mem_limit: ${ZONE_VIEWER_MEM_LIMIT:-64m}
    restart: unless-stopped

  dns-admin:
    build:
      context: ../modules/dns-ui/dns-admin
    image: gitopsdojo/dns-admin:local
    container_name: workshop_dns_admin
    init: true
    depends_on:
      - dns-server
    environment:
      - PDNS_API_URL=http://dns-server:8081
      - POWERDNS_API_KEY=${POWERDNS_API_KEY:-workshop-not-a-secret}
      # Must match the route's path in extensions.json.
      - PATH_PREFIX=/dns-admin
      # The wrapper answers only requests carrying this token (set by the
      # gateway) and logs in only the facilitator named here.
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:?Set GATEWAY_TOKEN in engine/.env}
      - FACILITATOR_USERNAME=${FACILITATOR_USERNAME:-root}
      # One facilitator: the base image's default of 4 workers filled 256m.
      - GUNICORN_WORKERS=${DNS_ADMIN_WORKERS:-2}
      # gunicorn keeps its control socket under $HOME; the root filesystem is read-only.
      - HOME=/tmp
    networks:
      - dns_admin_net
    # Runs as root (the base image's user); it only needs to bind :80.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # Nothing in the image is written at run time except the SQLite file
    # (/data) and gunicorn's worker heartbeats (/tmp); both are tmpfs, so
    # they reset with every start, like dns-server.
    read_only: true
    tmpfs:
      - /data:size=32m
      - /tmp:size=32m
    pids_limit: 128
    mem_limit: ${DNS_ADMIN_MEM_LIMIT:-384m}
    restart: unless-stopped

  # Added to the workshop's own dns-server (map form: the workshops declare
  # it that way, cert-autorenewal because it pins an address).
  dns-server:
    networks:
      dns_admin_net: {}

  # Added to the engine's own networks (lists append).
  gateway:
    networks:
      - dns_admin_net

  # The "DNS Zones" card, both /admin tabs, the /dns and /dns-admin routes and
  # the status-strip entry are in extensions.json.

networks:
  # Only the gateway, dns-admin and dns-server are on it.
  dns_admin_net:
    internal: true
