<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>DNS Zones</title>
  <link rel="icon" type="image/svg+xml" href="static/favicon.svg">
  <link rel="stylesheet" href="static/app.css">
  <script src="static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="static/favicon.svg" alt="" width="24" height="24">
      <span>DNS Zones</span>
      <span class="sub">live from PowerDNS, read-only</span>
    </div>
    <div class="controls">
      <label class="filter">
        <span class="visually-hidden">Filter records</span>
        <input type="search" id="filter" placeholder="Filter by name, type or value" autocomplete="off">
      </label>
      <button type="button" class="btn" id="clear">Clear highlights</button>
    </div>
  </header>

  <p class="status" id="status" role="status">Loading&hellip;</p>
  <p class="legend" id="legend" hidden>
    <span class="tag tag-new">new</span> added,
    <span class="tag tag-changed">changed</span> TTL or value changed,
    <span class="tag tag-removed">removed</span> gone, since you opened this page or last cleared.
  </p>

  <main id="zones"></main>
</body>
</html>
