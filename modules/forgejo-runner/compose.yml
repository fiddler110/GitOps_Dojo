# forgejo-runner module: a Forgejo Actions runner for the workshop repo, so
# the sample repo's .forgejo/workflows/ actually run. Layered on top of
# engine/docker-compose.yml by engine/run.sh when a workshop.env lists it in
# MODULES (see README.md). Relative paths resolve against engine/, not this
# folder.
#
# `environment:` and `networks:` added here for git-server merge with the
# engine's own. networks stays in list form, same as the engine's: mixing
# list and map for one service fails at `up` under podman-compose.

services:
  git-server:
    environment:
      - FORGEJO__actions__ENABLED=true
    # Added to the engine's own networks (lists append): runner_net so the
    # (student-code-executing) runner can poll it for jobs without also
    # reaching the control plane.
    networks:
      - runner_net

  # One-shot: registers the runner (server-side, via the `forgejo` CLI
  # already used by engine/git-server/bootstrap.sh) and writes its
  # config.yaml to the runner_config volume. See runner/register.sh. Uses the
  # same image/admin volume access bootstrap.sh already has - no new
  # credentials needed.
  runner-setup:
    image: codeberg.org/forgejo/forgejo:${FORGEJO_VERSION:-16.0.4}
    container_name: workshop_runner_setup
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    user: "1000:1000"
    environment:
      - FORGEJO_ORG=${FORGEJO_ORG:-training}
      - FORGEJO_REPO=${FORGEJO_REPO:-sample-training-repo}
      - RUNNER_NAME=${RUNNER_NAME:-}
    volumes:
      - forgejo_data:/data
      - ../modules/forgejo-runner/runner/register.sh:/register.sh:ro
      - runner_config:/runner-config
    entrypoint: ["/bin/sh", "/register.sh"]
    # Only needs git-server (for the config.yaml URL the runner daemon will
    # use), not the rest of workshop_lab.
    networks:
      - runner_net
    restart: "no"

  # The runner itself. Jobs run directly in this container (a `host` label,
  # no docker.sock anywhere in this stack), so the tools a workflow calls
  # must be baked into this image. runner/Dockerfile has only the basics; a
  # workshop whose jobs need more points build.context at its own Dockerfile
  # in its overlay (dns-as-code does, for dnscontrol).
  forgejo-runner:
    build:
      context: ../modules/forgejo-runner/runner
    container_name: workshop_runner
    depends_on:
      runner-setup:
        condition: service_completed_successfully
    volumes:
      - runner_config:/runner-config:ro
      # The runner image declares VOLUME /data (its working directory). Left
      # unmounted, every start creates an anonymous volume that `down
      # --volumes` (./run.sh stop) never removes; named, it goes with the rest.
      - runner_data:/data
    command: ["/bin/forgejo-runner", "daemon", "--config", "/runner-config/config.yaml"]
    # Runs student-authored CI directly on this container's own filesystem
    # (host label, no sandbox) - isolated to runner_net so a compromised
    # runner can only reach git-server (and whatever a workshop adds to
    # runner_net on purpose), never allocator or web-terminal (the control
    # plane).
    networks:
      - runner_net
    restart: unless-stopped

volumes:
  runner_config:
  runner_data:

networks:
  # Isolates the runner (which executes student-authored CI) from the
  # control plane (allocator, web-terminal).
  runner_net:
    internal: true
