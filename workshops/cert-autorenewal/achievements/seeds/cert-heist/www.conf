# www.{user}.certs.dojo.test. Copy to /srv/webroot/{user}/conf.d/www.conf.
#
# Safe to copy in as it is: the HTTPS block is commented out. nginx refuses a
# `listen 443 ssl` block without a certificate, and while any vhost fails
# `nginx -t` the demo site reloads for nobody in the class. Uncomment it once
# the certificate is installed and both certificate lines point at it.

# HTTPS: point the two certificate lines at your wildcard certificate.
# server {
#     listen 443 ssl;
#     server_name www.{user}.certs.dojo.test;
#
#     ssl_certificate     TODO;
#     ssl_certificate_key TODO;
#
#     root /srv/webroot/{user}/www-html;
#
#     location / {
#         try_files $uri $uri/ =404;
#     }
# }

# Plain HTTP: for now it serves the site unencrypted. The capstone wants every
# request here sent to the HTTPS site instead, permanently.
server {
    listen 80;
    server_name www.{user}.certs.dojo.test;

    root /srv/webroot/{user}/www-html;

    location / {
        try_files $uri $uri/ =404;
    }
}
