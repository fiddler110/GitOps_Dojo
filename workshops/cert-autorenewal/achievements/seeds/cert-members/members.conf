# members.{user}.certs.dojo.test: a site only for clients that show a
# certificate from the lab CA (mutual TLS).
# Copy to /srv/webroot/{user}/conf.d/members.conf.
#
# The port-80 block works as it is: it answers the ACME http-01 challenge
# from members' own folder and sends everything else to HTTPS.
#
# The HTTPS block is commented out because it is not finished: a vhost that
# fails `nginx -t` stops the demo site reloading for the whole class. Fill in
# every TODO, then uncomment it (and run the README's check before copying).

server {
    listen 80;
    server_name members.{user}.certs.dojo.test;

    root /srv/webroot/{user}/members-html;

    location /.well-known/acme-challenge/ {
        root /srv/webroot/{user}/members-html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

