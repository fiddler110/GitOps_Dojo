# Port-80 vhost for shop.{user}.certs.dojo.test.
# Copy to /srv/webroot/{user}/conf.d/shop.conf. It answers the ACME http-01
# challenge from shop's own folder, so your first site is untouched.
#
# The HTTPS part is yours: once you have a certificate, add a second server
# block for the same name with `listen 443 ssl` and your certificate and key
# (Lab 2's vhost-tls template shows the shape). The check reads that block in
# the shop.conf you push to main, and connects to https://shop.... Keep this
# port-80 block: every renewal answers http-01 here again.

server {
    listen 80;
    server_name shop.{user}.certs.dojo.test;

    root /srv/webroot/{user}/shop-html;

    location /.well-known/acme-challenge/ {
        root /srv/webroot/{user}/shop-html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
