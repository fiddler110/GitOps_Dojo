worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # One file per student, entirely owned by that student — see
    # workshops/cert-autorenewal/content/sample-repo/vhost.conf.template
    # for what a student actually writes here. A glob that matches nothing
    # (no students have written a vhost yet) is valid nginx config, not an
    # error, so this container starts cleanly before any student acts.
    include /srv/webroot/*/conf.d/*.conf;

    # Fallback so `nginx -t` / startup never depends on a student vhost
    # existing yet.
    server {
        listen 80 default_server;
        return 404;
    }
}
