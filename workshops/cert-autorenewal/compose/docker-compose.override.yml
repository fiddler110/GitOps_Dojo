# Overlay for the cert-autorenewal workshop, layered on top of
# engine/docker-compose.yml via `docker compose -f docker-compose.yml -f
# <this file>` (see engine/run.sh).
#
# IMPORTANT: because this file is merged with a base file, Compose resolves
# every relative path in BOTH files relative to the base file's directory —
# engine/, not this file's own directory. That's why every `build.context`
# below is `../workshops/cert-autorenewal/compose/...`, not `./...`. See
# workshops/README.md for the full explanation (same gotcha dns-as-code
# documents).
#
# Adds:
#   - dns-server: PowerDNS, authoritative for certs.dojo.test. This
#     workshop's own instance (workshops can't share a running service with
#     another workshop today — run.sh only ever activates one overlay at a
#     time) — same image/pattern as dns-as-code, for skill continuity.
#   - dns-api (from the dns-gate module, MODULES in workshop.env): the only
#     way to the PowerDNS API for terminals. Each account's own key changes
#     only names under <user>.certs.dojo.test, so dns-01 is per-student.
#     PowerDNS's own key (POWERDNS_API_KEY, derived in workshop.env) goes to
#     dns-server, dns-seed, dns-api and dns-ui only.
#   - dns-seed: one-shot, creates the zone + one A record per student
#     pointing at demo-app, so http-01 challenges resolve without a
#     DNS-editing step being a prerequisite for Labs 1-4.
#   - step-ca: a single shared ACME CA (Smallstep). Its ACME provisioner's
#     cert lifetime is shortened at init (see compose/step-ca/entrypoint.sh)
#     so automated renewal (Lab 4) is actually observable within a lab
#     session, and it issues only names under certs.dojo.test. Its
#     passwords are generated at first start and never leave its volume. Its entrypoint also repoints /etc/resolv.conf at PowerDNS —
#     step-ca performs its own DNS lookups when validating http-01/dns-01
#     challenges, and needs to resolve names in a private zone the
#     container's default resolver doesn't know about.
#   - demo-app: one shared nginx container. Isolation is per-student vhost
#     ownership on a shared volume (cert_lab_webroot) — each student writes
#     only their own subdirectory, same "shared backend, per-file
#     ownership" pattern dns-as-code uses for its shared zone file. A
#     watcher inside the container reloads nginx on change; no docker.sock
#     or cross-container exec is granted to students or to this workshop's
#     own services, consistent with the allocator's existing design
#     principle (see CLAUDE.md).
#   - web-terminal: swapped for an image with step/certbot/acme.sh
#     preinstalled, plus access to the shared webroot volume and a
#     read-only copy of the CA's public root cert (never its private keys).
#     Also bind-mounts content/sample-repo straight into /opt/lab/sample-repo
#     so entrypoint.sh's existing /opt/lab -> ~/lab copy seeds it into every
#     student's home directory directly — no git clone step needed, since
#     this workshop has no other Forgejo interaction (no push, no PR, no
#     CI). content/sample-repo stays the single copy; bootstrap still pushes
#     it to Forgejo too, same as every other workshop.
#
# `environment:`/`volumes:`/`networks:` entries added here for a service the
# base file already defines merge with the base's own values (key-by-key
# for maps, concatenated for lists) rather than replacing them:
# https://docs.docker.com/compose/how-tos/multiple-compose-files/merge/

services:
  # PowerDNS authoritative server, ephemeral by design like every other
  # service in this stack (sqlite backend in the container's own
  # filesystem, no volume — resets on `docker compose down`/rebuild).
  # Internal-only. Pinned to a static IP so step-ca's entrypoint (see
  # DNS_SERVER_IP below) has a stable address to point its resolver at.
  dns-server:
    image: docker.io/powerdns/pdns-auth-49:4.9.17@sha256:b554df74bbde1afa7caedad4af9c91378be6d46d05807d089b3c7c443002e684
    container_name: workshop_cert_powerdns
    environment:
      # `:-` not `:?`: ./run.sh stop reads this file without workshop.env.
      # An empty key leaves PowerDNS's API off.
      - PDNS_AUTH_API_KEY=${POWERDNS_API_KEY:-}
    # PowerDNS binds port 53 (< 1024) as non-root in this image — without
    # this capability it fails at startup (same as dns-as-code's dns-server).
    cap_add:
      - NET_BIND_SERVICE
    networks:
      workshop_lab:
        ipv4_address: 172.30.0.10
    restart: unless-stopped

  # One-shot: creates the certs.dojo.test zone and one A record per
  # configured student pointing at demo-app, via PowerDNS's HTTP API. Runs
  # every `docker compose up`; idempotent (skips a record/zone that already
  # exists). See compose/dns-seed/seed.sh.
  dns-seed:
    build:
      context: ../workshops/cert-autorenewal/compose/dns-seed
    container_name: workshop_cert_dns_seed
    depends_on:
      - dns-server
    environment:
      - STUDENT_COUNT=${STUDENT_COUNT:-30}
      - STUDENT_PREFIX=${STUDENT_PREFIX:-student}
      - FACILITATOR_USERNAME=${FACILITATOR_USERNAME:-root}
      - CERT_LAB_ZONE=${CERT_LAB_ZONE:-certs.dojo.test}
      - POWERDNS_API_KEY=${POWERDNS_API_KEY:-}
      - DEMO_APP_IP=172.30.0.20
    networks:
      - workshop_lab
    restart: "no"

  # From modules/dns-gate/ (see the header).
  dns-api:
    depends_on:
      - dns-server

  # Shared ACME CA. See compose/step-ca/entrypoint.sh for the init +
  # claims-shortening + root-cert-export logic (it wraps `step ca init`
  # directly rather than the upstream image's own init script, so the
  # ACME provisioner's claims can be edited before step-ca starts serving).
  step-ca:
    build:
      context: ../workshops/cert-autorenewal/compose/step-ca
    container_name: workshop_step_ca
    environment:
      # step-ca validates ACME challenges (http-01 and dns-01) by looking up
      # the target hostname itself — it needs to resolve names in the
      # private certs.dojo.test zone that the container's default resolver
      # doesn't know about. Compose's `dns:` key is the documented way to
      # do this, but podman-compose doesn't honor it, so entrypoint.sh
      # rewrites /etc/resolv.conf itself at startup using this instead —
      # see that file for the detail.
      - DNS_SERVER_IP=172.30.0.10
      # The accounts whose own subtree (*.<account>.certs.dojo.test) the CA
      # may sign, as dns-seed makes their records (see entrypoint.sh).
      - STUDENT_COUNT=${STUDENT_COUNT:-30}
      - STUDENT_PREFIX=${STUDENT_PREFIX:-student}
      - FACILITATOR_USERNAME=${FACILITATOR_USERNAME:-root}
    volumes:
      - step_ca_data:/home/step
      - step_ca_root_pub:/pub
      # Its client certificate for the achievements checker (entrypoint.sh); the
      # achievements module mounts the same volume read-only.
      - achievements_client_cert:/client
    networks:
      - workshop_lab
    restart: unless-stopped

  # Shared demo web app. See compose/demo-app/entrypoint.sh for the
  # inotify-watch-and-reload loop.
  demo-app:
    build:
      context: ../workshops/cert-autorenewal/compose/demo-app
    container_name: workshop_cert_demo_app
    volumes:
      - cert_lab_webroot:/srv/webroot
    networks:
      workshop_lab:
        ipv4_address: 172.30.0.20
    restart: unless-stopped

  # The "Site Inspector" card (/inspect, identity gate; extensions.json): a browser's visit to a
  # student's own names on demo-app, one step at a time: redirects, the certificate and whether it
  # verifies against the lab CA, HSTS (remembered like a browser), the security headers, and the page
  # with scripts off. Students have no browser that reaches demo-app's HTTPS, so this is their browser.
  # It connects only to demo-app (ports 80 and 443, GET only) and only for the viewer's own names.
  site-inspector:
    build:
      context: ../workshops/cert-autorenewal/compose/site-inspector
    image: gitopsdojo/site-inspector:local
    container_name: workshop_cert_site_inspector
    init: true
    depends_on:
      - demo-app
      - step-ca
    environment:
      # Identity headers count only with this token (derived per upstream by run.sh).
      - GATEWAY_TOKEN=${GATEWAY_TOKEN_SITE_INSPECTOR:-}
      - FACILITATOR_USERNAME=${FACILITATOR_USERNAME:-root}
      - ZONE=${DEMO_APP_ZONE:-certs.dojo.test}
      - TARGET_HOST=demo-app
      - CA_ROOT=/opt/step-ca-root/root_ca.crt
    volumes:
      - step_ca_root_pub:/opt/step-ca-root:ro
    networks:
      - workshop_lab
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=4m
    pids_limit: 64
    mem_limit: ${SITE_INSPECTOR_MEM_LIMIT:-64m}
    restart: unless-stopped

  # Image: compose/terminal/, built and selected by engine/run.sh.
  web-terminal:
    # dns-seed is deliberately not listed here: it's a one-shot container
    # that exits(0) once it's done seeding, and podman-compose's plain
    # depends_on waits for a "running" state — depending on a service that's
    # designed to exit hangs `up` forever. Its work (seeding DNS records)
    # only needs to finish before a student runs a lab command, not before
    # this container starts.
    depends_on:
      - dns-server
      - step-ca
      - demo-app
    volumes:
      - cert_lab_webroot:/srv/webroot
      # Lands under /opt/lab (the base file's own read-only mount for
      # content/lab) so entrypoint.sh's per-account `cp -Rn /opt/lab/. ~/lab/`
      # picks it up too, seeding ~/lab/sample-repo without a git clone step.
      - ${WORKSHOP_CONTENT_DIR:?Set WORKSHOP_CONTENT_DIR in engine/.env}/sample-repo:/opt/lab/sample-repo:ro
      # Public root cert only — never the CA's private keys/secrets.
      - step_ca_root_pub:/opt/step-ca-root:ro

volumes:
  step_ca_data:
  step_ca_root_pub:
  cert_lab_webroot:
  achievements_client_cert:

# workshop_lab has no static subnet in the base engine file (Docker
# auto-assigns one) — this adds one so dns-server/demo-app can be pinned to
# stable IPs. Merges additively with the base network definition, the same
# way dns-as-code adds `environment:` to the existing git-server service.
networks:
  workshop_lab:
    ipam:
      config:
        - subnet: 172.30.0.0/24
