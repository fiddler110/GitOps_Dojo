# CTF-5 defend pipeline — PR gate for target 14 `customer-portal`.
#
# This is the "scan + exploit re-run" half of the S6 loop (plan §8, §8.12,
# CTF-P6). It runs on every PR the student opens against their target repo:
#
#   1. SAST (informational)  — points at the flaw; NEVER fails the job (CTF-D23).
#   2. Exploit re-run (GATE) — the PR passes ONLY if the injection now fails
#                              (exploit/dump.py exits 1 = patched). This is the
#                              single red/yellow/green decision (CTF-D19).
#
# Offline posture (CTF-D24): nothing is fetched at run time. The SAST tool is
# stdlib. The app is exercised as a plain process, so the runner image must
# carry Flask baked in (one line in modules/runner-pool/pool/Dockerfile when
# this is wired — same "baked, never fetched" rule as the SAST/SCA tools). No
# container build and no docker.sock are needed to test a *source* change; the
# image build + registry push + redeploy is the merge job (defend-main.yml).
name: Defend — PR gate
on:
  pull_request:

jobs:
  scan-and-gate:
    runs-on: host
    env:
      # Per-slot flag value, injected by the controller the same way the live
      # target gets it (§5). The seed plants it; the gate confirms it leaks.
      CTF_FLAG: ${{ secrets.CTF_FLAG }}
      CTF_STUDENT: ${{ github.repository_owner }}
      CTF_DB_PATH: /tmp/portal-ci.db
      PORT: "5000"
    steps:
      - name: Checkout PR source
        run: |
          set -eu
          rm -rf repo
          git clone --quiet "http://git-server:3000/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout --quiet "$GITHUB_SHA"

      - name: SAST (CWE-89, informational)
        # Prints findings that point the student at the flaw, like a real team's
        # pipeline output. `|| true` enforces CTF-D23: the scan never gates.
        run: |
          set -eu
          cd repo
          python3 sast/scan.py app.py || true

      - name: Start the app under test
        run: |
          set -eu
          cd repo
          rm -f "$CTF_DB_PATH"
          python3 seed.py
          python3 app.py >/tmp/portal-ci.log 2>&1 &
          echo $! > /tmp/portal-ci.pid
          # Wait for /healthz rather than a blind sleep.
          for _ in $(seq 1 30); do
            if python3 -c "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:5000/healthz',timeout=1)" 2>/dev/null; then
              echo "app up"; exit 0
            fi
            sleep 0.2
          done
          echo "app did not become healthy"; cat /tmp/portal-ci.log; exit 2

      - name: Gate premise (the seeded secret must still exist)
        # The exploit re-run below only means something if the flag is still in the
        # database for it to find. A change that removes it would "pass" the gate
        # without fixing anything, so check the premise first.
        run: |
          set -eu
          python3 - <<'PY'
          import os, sqlite3, sys
          n = sqlite3.connect(os.environ["CTF_DB_PATH"]).execute(
              "SELECT COUNT(*) FROM customers WHERE password = ?", (os.environ["CTF_FLAG"],)).fetchone()[0]
          if n == 0:
              print("GATE ERROR: the service account's secret is no longer stored where the gate expects it.")
              sys.exit(2)
          PY

      - name: Exploit re-run (CTF-D19 gate)
        # dump.py: exit 0 = still vulnerable, 1 = patched, 2 = unreachable.
        # The gate passes ONLY on a patched app (1); a vulnerable app (0) fails
        # the PR; an unreachable target (2) is an operational error, not a pass.
        run: |
          set -eu
          cd repo
          set +e
          python3 exploit/dump.py --url http://127.0.0.1:5000 --expect-flag "$CTF_FLAG"
          code=$?
          set -e
          case "$code" in
            1) echo "GATE PASS — injection returns nothing; target is patched (green)." ;;
            0) echo "GATE FAIL — the dump still leaks the flag; the query is still vulnerable (red)."; exit 1 ;;
            *) echo "GATE ERROR — could not reach the target under test."; exit 2 ;;
          esac

      - name: Stop the app
        if: always()
        run: |
          set -eu
          [ -f /tmp/portal-ci.pid ] && kill "$(cat /tmp/portal-ci.pid)" 2>/dev/null || true
