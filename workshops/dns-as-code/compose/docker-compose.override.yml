# Overlay for the dns-as-code workshop, layered on top of engine/docker-compose.yml
# and the runner-pool, dns-ui and dns-gate modules (MODULES in workshop.env)
# by dojo.
#
# IMPORTANT: because this file is merged with a base file, Compose resolves
# every relative path in it relative to the base file's directory —
# engine/, not this file's own directory. That's why `build.context` below
# is `../workshops/dns-as-code/compose/runner`, not `./runner`.
#
# Adds dns-server (a PowerDNS authoritative server students push real
# records to and `dig` against) and gives CI jobs the terminal's dnscontrol.
# The terminal image (dnscontrol + python3) is compose/terminal/, built by
# dojo. Forgejo Actions and the single-use runners come from
# modules/runner-pool/, the dns-api gate from modules/dns-gate/.
#
# Two kinds of zone (see content/lab/README.md):
#   - <user>.dojo.test, each account's own sandbox (Part 1), in
#     ~/lab/my-zone (terminal/start.d/90-my-zone.sh); students push it themselves.
#   - dojo.test, the shared "production" zone (Part 2): only CI changes it.
# Enforced in two places: dns-api (a gate in front of the PowerDNS API: each
# account's key changes only its own zone, and dojo.test changes only with an
# ID token from a push to main, see workshop.env) and dns-gates (branch
# protection: main takes only reviewed PRs with a passing preview).
#
#   terminals --workshop_lab--> dns-api --> dns-server:8081 (internal key)
#   CI jobs ---runner_net-----> dns-api        (dojo.test with an ID token)

services:
  # PowerDNS authoritative server. Ephemeral by design, same as every other
  # service in this stack: sqlite backend lives in the container's own
  # filesystem (no volume), so it resets on every `docker compose down` /
  # rebuild. Internal-only — students never reach it through the gateway,
  # only from inside their terminal (dnscontrol push, dig).
  #
  # PDNS_AUTH_API_KEY enables PowerDNS's built-in HTTP API + webserver on
  # :8081 (see https://github.com/PowerDNS/pdns/blob/master/Docker-README.md).
  dns-server:
    image: docker.io/powerdns/pdns-auth-49:4.9.17@sha256:b554df74bbde1afa7caedad4af9c91378be6d46d05807d089b3c7c443002e684
    container_name: workshop_powerdns
    # POWERDNS_API_KEY is derived in workshop.env from the install's
    # GATEWAY_TOKEN: only dns-api and the dns-ui module get it.
    # `:-` not `:?`: `./dojo stop` reads this file without workshop.env.
    # An empty key leaves PowerDNS's API off, and dns-api refuses to start.
    environment:
      - PDNS_AUTH_API_KEY=${POWERDNS_API_KEY:-}
    # PowerDNS binds DNS's standard port 53 (< 1024) as a non-root process
    # in this image — without this capability it fails at startup with
    # "Unable to bind UDP socket ... Permission denied" (confirmed by
    # actually running this container; not a guess).
    cap_add:
      - NET_BIND_SERVICE
    # workshop_lab for students' own terminal sessions (dig/dnscontrol),
    # runner_net (from the runner-pool module) so CI workflow runs (dnscontrol push)
    # can reach it too, without the runners needing the rest of workshop_lab.
    # Map form, not list: the dns-ui module adds dns_admin_net to this
    # service in map form, and podman-compose fails at `up` when one
    # service's networks mix the two.
    networks:
      workshop_lab: {}
      runner_net: {}
    restart: unless-stopped

  # From modules/dns-gate/: the only way to the PowerDNS API. CI jobs reach
  # it over runner_net.
  dns-api:
    depends_on:
      - dns-server
    networks:
      - runner_net

  # One-shot: branch protection on the workshop repo's main
  # (compose/gates/protect-main.sh). Same image and admin credentials as the
  # engine's bootstrap, after it has created and seeded the repo.
  dns-gates:
    image: codeberg.org/forgejo/forgejo:16.0.4@sha256:a3e33d03e771d3e58b27de5573c3a25dc4f670583a6724c1878a6d0bbecf3556
    container_name: workshop_dns_gates
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      - FORGEJO_ORG=${FORGEJO_ORG:-training}
      - FORGEJO_REPO=${FORGEJO_REPO:-sample-training-repo}
      - FORGEJO_ADMIN_USER=${FORGEJO_ADMIN_USER:?Set FORGEJO_ADMIN_USER in .env or dojo.toml}
      - FORGEJO_ADMIN_PASSWORD=${FORGEJO_ADMIN_PASSWORD:?Set FORGEJO_ADMIN_PASSWORD in .env or dojo.toml}
      - DNS_REQUIRED_APPROVALS=${DNS_REQUIRED_APPROVALS:-1}
    # The Forgejo image declares VOLUME /data; naming it lets ./dojo stop
    # remove it (an anonymous one is left behind).
    volumes:
      - ../workshops/dns-as-code/compose/gates/protect-main.sh:/protect-main.sh:ro
      - dns_gates_data:/data
    entrypoint: ["/bin/sh", "/protect-main.sh"]
    networks:
      - runner_net
    restart: "no"

  # Image: compose/terminal/, built and selected by dojo.
  web-terminal:
    depends_on:
      - dns-server
    # The seed repo's docs, read by start.d/90-my-zone.sh so each sandbox gets
    # docs/record-types.md from the one source copy.
    volumes:
      - ../workshops/dns-as-code/content/sample-repo/docs:/opt/dojo/dns-docs:ro

  # CI jobs run the terminal's own dnscontrol (runner-pool copies it in).
  runner-pool:
    image: gitopsdojo/runner-pool:dns-as-code
    build:
      args:
        JOB_TOOLS: "dnscontrol"

volumes:
  dns_gates_data:
