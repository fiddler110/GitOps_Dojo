# Runs on this lab's single-use Forgejo Actions runners (the runner-pool
# module in the workshop authoring repo - not part of this lab repo
# itself): each job gets a fresh runner. No `uses: actions/checkout@...` here
# on purpose: this instance's actions network is internal-only, so nothing
# outside this repo's own git-server is reachable - checkout is a plain
# `git clone` against it instead.
#
# It previews the PR *merged into main*, not the branch on its own: other
# people's PRs keep landing on main, and a branch made before them would
# otherwise show their records as DELETEs. No `paths:` filter: "DNS Preview"
# is a required check on main (branch protection), so every PR needs one.
name: DNS Preview

on:
  pull_request:
    branches: [main]

jobs:
  preview:
    runs-on: host
    # The lab's read-only key: a preview only reads. Nothing a PR changes in
    # this file can write DNS: the dns-api gate lets only DNS Apply's token
    # (a push to main of this repo) change dojo.test.
    env:
      DNS_API_KEY: workshop-not-a-secret
    steps:
      - name: Merge the PR into main (locally)
        run: |
          set -eu
          PR_NUMBER=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
          HEAD_SHA=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
          BASE_REF=$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          rm -rf repo
          git clone --quiet --branch "$BASE_REF" "http://git-server:3000/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git fetch --quiet origin "$HEAD_SHA"
          if git -c user.name=ci -c user.email=ci@example.invalid merge --quiet --no-edit "$HEAD_SHA"; then
            echo "MERGE_OK=1" >> "$GITHUB_ENV"
          else
            git merge --abort
            echo "MERGE_OK=0" >> "$GITHUB_ENV"
          fi

      - name: dnscontrol preview
        id: preview
        run: |
          set +e
          if [ "$MERGE_OK" = 1 ]; then
            (cd repo && dnscontrol preview) >preview-output.txt 2>&1
            echo "status=$?" >>"$GITHUB_OUTPUT"
          else
            printf '%s\n' "This branch conflicts with main, so there is nothing to preview yet." \
              "Bring main into your branch (git pull origin main), resolve the conflict," \
              "run dnscontrol preview, then push again." >preview-output.txt
            echo "status=1" >>"$GITHUB_OUTPUT"
          fi
          cat preview-output.txt

      - name: Post preview as a PR comment
        if: always()
        run: |
          # Marker text must stay "### dnscontrol preview" - dnsctl.py's
          # `review` command finds this comment by the literal substring
          # "dnscontrol preview".
          jq -Rs '{body: ("### dnscontrol preview\n\n```\n" + . + "\n```")}' preview-output.txt >comment.json

          # Update-in-place on a re-run (another push to the same PR)
          # instead of spamming a new comment each time.
          existing_id=$(curl -sf "http://git-server:3000/api/v1/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            | jq -r '[.[] | select(.body | startswith("### dnscontrol preview"))][0].id // empty')

          if [ -n "$existing_id" ]; then
            curl -sf -X PATCH "http://git-server:3000/api/v1/repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d @comment.json
          else
            curl -sf -X POST "http://git-server:3000/api/v1/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d @comment.json
          fi

      - name: Set DNS Preview commit status
        if: always()
        run: |
          state=success
          if [ "${{ steps.preview.outputs.status }}" != "0" ]; then state=failure; fi
          jq -n --arg state "$state" \
            '{state: $state, context: "DNS Preview", description: "dnscontrol preview"}' >status.json
          curl -sf -X POST "http://git-server:3000/api/v1/repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @status.json

      - name: Fail the job if preview failed
        run: exit ${{ steps.preview.outputs.status }}
