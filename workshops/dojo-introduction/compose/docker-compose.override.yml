# Overlay for dojo-introduction, layered on top of engine/docker-compose.yml
# and the runner-pool, dojo-cloud, dns-ui and dns-gate modules (MODULES in
# workshop.env) by dojo. Relative paths resolve against engine/, not
# this folder.
#
# The tour shows Forgejo with CI, DNS as code and Dojo Cloud. It reuses the
# other workshops' sources instead of copying them (a bind mount points at
# workshops/<name>/...):
#   - dns-server (PowerDNS), as dns-as-code runs it. dnscontrol creates each
#     account's own <user>.dojo.test zone on its first push.
#   - dns-api, from the dns-gate module: the only way from a terminal to the
#     PowerDNS API, so `dnscontrol push` works in each account's own zone
#     (~/lab/my-zone, from dns-as-code's 90-my-zone.sh hook), with that
#     account's own key. The shared dojo.test zone is refused for everyone: it
#     is a CI-only zone with no CI repo (workshop.env), and this pack has no
#     branch protection.
#   - every workshop's slides, served under /slides/w/<name>/.
# The vault (openbao) and the certificate lab (step-ca, the demo site) are
# left out to keep the tour light.

services:
  # PowerDNS. Map-form networks because dns-ui adds dns_admin_net to it.
  dns-server:
    image: docker.io/powerdns/pdns-auth-49:4.9.17@sha256:b554df74bbde1afa7caedad4af9c91378be6d46d05807d089b3c7c443002e684
    container_name: workshop_powerdns
    # `:-` not `:?`: ./dojo stop reads this file without workshop.env.
    environment:
      - PDNS_AUTH_API_KEY=${POWERDNS_API_KEY:-}
    cap_add:
      - NET_BIND_SERVICE
    networks:
      workshop_lab: {}
    restart: unless-stopped

  # From the dns-gate module (MODULES in workshop.env).
  dns-api:
    depends_on:
      - dns-server

  # CI jobs get the terminal's own dnscontrol (the hello workflow calls it).
  runner-pool:
    image: gitopsdojo/runner-pool:dojo-introduction
    build:
      args:
        JOB_TOOLS: "dnscontrol"

  # The slide hub links to each workshop's own index.md. Each pack's slides go
  # under /slides/w/<name>/, and the shared assets over its assets/ folder, as
  # the engine does for the running workshop. The lab copies (lab/*.md.txt) are
  # made for every pack by dojo.
  presentation:
    volumes:
      - ../workshops/git-fundamentals/content/slides:/home/marp/app/w/git-fundamentals:ro
      - ../workshops/assets:/home/marp/app/w/git-fundamentals/assets:ro
      - ../workshops/dns-as-code/content/slides:/home/marp/app/w/dns-as-code:ro
      - ../workshops/assets:/home/marp/app/w/dns-as-code/assets:ro
      - ../workshops/cert-autorenewal/content/slides:/home/marp/app/w/cert-autorenewal:ro
      - ../workshops/assets:/home/marp/app/w/cert-autorenewal/assets:ro
      - ../workshops/tofu-basics/content/slides:/home/marp/app/w/tofu-basics:ro
      - ../workshops/assets:/home/marp/app/w/tofu-basics/assets:ro
      - ../workshops/vault-fundamentals/content/slides:/home/marp/app/w/vault-fundamentals:ro
      - ../workshops/assets:/home/marp/app/w/vault-fundamentals/assets:ro

  # Image: compose/terminal/, built and selected by dojo.
  web-terminal:
    depends_on:
      - dns-server
    volumes:
      # Each account's ~/lab/my-zone (dnscontrol config for <user>.dojo.test) and
      # the record-types doc it copies in, both from dns-as-code.
      - ../workshops/dns-as-code/compose/terminal/start.d/90-my-zone.sh:/etc/dojo/start.d/90-my-zone.sh:ro
      - ../workshops/dns-as-code/content/sample-repo/docs:/opt/dojo/dns-docs:ro
