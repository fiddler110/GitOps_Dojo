# Overlay for the tofu-basics workshop, layered on top of engine/docker-compose.yml
# via `docker compose -f docker-compose.yml -f <this file>` (see engine/run.sh).
#
# IMPORTANT: because this file is merged with a base file, Compose resolves
# every relative path in BOTH files relative to the base file's directory —
# engine/, not this file's own directory. That's why `build.context` below
# is `../workshops/tofu-basics/compose/...`, not `./...`.
#
# Track A (offline sandbox) only needs the swapped terminal image. Track B adds
# "Dojo Cloud", an Azure-inspired training cloud:
#
#   student terminal --HTTPS, ARM API--> cloud-api --docker.sock (shared volume)--> cloud-host
#   (workshop_lab)                       (both nets)                                (cloud_net only)
#
# cloud-host is a privileged Docker-in-Docker daemon. That is acceptable ONLY
# because of how it is boxed in: it is on an `internal: true` network with no
# route to the internet or to any student, publishes no ports to the host, has
# no listener except a unix socket shared with cloud-api, and the only thing that
# ever talks to it is cloud-api's fixed-template executor. Students never speak
# Docker. See PLAN.md §7.

services:
  cloud-host:
    build:
      context: ../workshops/tofu-basics/compose/cloud-host
    image: gitopsdojo/cloud-host:local
    container_name: workshop_cloud_host
    privileged: true
    volumes:
      - cloud_run:/run/cloud
    networks:
      - cloud_net
    healthcheck:
      test: ["CMD-SHELL", "docker image inspect dojo/hello:2.0 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    mem_limit: ${CLOUD_HOST_MEM_LIMIT:-3g}
    pids_limit: ${CLOUD_HOST_PIDS_LIMIT:-4096}
    restart: unless-stopped

  cloud-api:
    build:
      context: ../workshops/tofu-basics/compose/cloud-api
    image: gitopsdojo/cloud-api:local
    container_name: workshop_cloud_api
    depends_on:
      cloud-host:
        condition: service_healthy
    environment:
      - STUDENT_COUNT=${STUDENT_COUNT:-30}
      - STUDENT_PREFIX=${STUDENT_PREFIX:-student}
      - BOT_COUNT=${BOT_COUNT:-0}
      - BOT_PREFIX=${BOT_PREFIX:-testuser}
      - FACILITATOR_USERNAME=${FACILITATOR_USERNAME:-root}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in engine/.env}
      # Dojo Portal API trusts X-Auth-User only together with this token (the
      # gateway sets both; students on workshop_lab can reach :8080 directly).
      - GATEWAY_TOKEN=${GATEWAY_TOKEN:?Set GATEWAY_TOKEN in engine/.env}
    volumes:
      - cloud_run:/run/cloud
      - cloud_pki:/pki
      - cloud_secrets:/secrets
      - cloud_data:/data
    networks:
      cloud_net:
      workshop_lab:
        # The names the azurerm provider is pointed at (ARM_METADATA_HOSTNAME
        # etc.); all covered by the private CA cloud-api creates.
        aliases:
          - management.dojo.cloud
          - login.dojo.cloud
          - portal.dojo.cloud
          - graph.dojo.cloud
          - cloud-api
    # Least privilege: it only needs to bind :443.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: ${CLOUD_API_MEM_LIMIT:-256m}
    restart: unless-stopped

  # Landing-page "Dojo Cloud" button + the gateway's /cloud route (engine D4).
  # Off in the base file, so no other workshop is affected.
  allocator:
    environment:
      - CLOUD_ENABLED=1

  web-terminal:
    build:
      context: ../workshops/tofu-basics/compose/terminal
    # Without this, Compose would inherit the base file's
    # `image: gitopsdojo/web-terminal:base` and tag this workshop-specific
    # build as ":base" too -- clobbering the shared base tag every time
    # this workshop runs (see engine/run.sh).
    image: gitopsdojo/web-terminal:tofu-basics
    depends_on:
      cloud-api:
        condition: service_healthy
    environment:
      # Handed to students' shells by the credential broker (TF_VAR_portal_base_url).
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in engine/.env}
    volumes:
      # CA certificate only (public); the CA key never leaves cloud-api.
      - cloud_pki:/run/cloud-pki:ro
      # Root-only signing key: the broker (root) reads it, students cannot.
      - cloud_secrets:/run/cloud-secrets:ro

volumes:
  cloud_run:
  cloud_pki:
  cloud_secrets:
  cloud_data:

networks:
  # Nothing on this network can reach the internet or any student terminal.
  cloud_net:
    internal: true
